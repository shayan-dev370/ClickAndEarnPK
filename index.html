<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Click&Earn - Earn Money Online</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans">

  <!-- Header / Navbar -->
  <nav class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-emerald-400">Click&Earn <span class="text-xs bg-emerald-500/20 text-emerald-300 px-2 py-1 rounded">PKR</span></h1>
      <div id="nav-user" class="hidden flex items-center gap-4">
        <span class="text-sm font-medium">Balance: <span id="user-balance" class="text-emerald-400 font-bold">PKR 0.00</span></span>
        <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded text-white font-semibold">Logout</button>
      </div>
    </div>
  </nav>

  <div class="max-w-3xl mx-auto p-4 mt-4">

    <!-- Status Alert Box -->
    <div id="alert-box" class="hidden p-4 mb-4 rounded-lg text-sm font-semibold border"></div>

    <!-- AUTH SECTION (Signup / Login) -->
    <div id="auth-box" class="max-w-md mx-auto bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
      <div class="flex border-b border-slate-700 mb-6">
        <button id="tab-login-btn" onclick="switchTab('login')" class="flex-1 py-2 font-semibold text-emerald-400 border-b-2 border-emerald-400">Login</button>
        <button id="tab-signup-btn" onclick="switchTab('signup')" class="flex-1 py-2 font-semibold text-slate-400">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Email</label>
          <input type="email" id="login-email" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:outline-none focus:border-emerald-500 text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
          <input type="password" id="login-password" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:outline-none focus:border-emerald-500 text-white">
        </div>
        <button type="submit" id="btn-login-submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded font-bold text-sm transition">Login to Dashboard</button>
      </form>

      <!-- Signup Form -->
      <form id="signup-form" onsubmit="handleSignup(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Full Name</label>
          <input type="text" id="signup-name" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:outline-none focus:border-emerald-500 text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Phone Number (Easypaisa/JazzCash)</label>
          <input type="text" id="signup-phone" placeholder="03001234567" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:outline-none focus:border-emerald-500 text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Email</label>
          <input type="email" id="signup-email" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:outline-none focus:border-emerald-500 text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
          <input type="password" id="signup-password" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:outline-none focus:border-emerald-500 text-white">
        </div>
        <button type="submit" id="btn-signup-submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded font-bold text-sm transition">Create Account</button>
      </form>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard" class="hidden space-y-6">

      <!-- Navigation Tabs -->
      <div class="flex border-b border-slate-700 mb-4">
        <button id="dash-tasks-btn" onclick="switchDashboardTab('tasks')" class="flex-1 py-2.5 font-bold text-emerald-400 border-b-2 border-emerald-400">Available Tasks (16)</button>
        <button id="dash-withdraw-btn" onclick="switchDashboardTab('withdraw')" class="flex-1 py-2.5 font-bold text-slate-400">Withdraw Funds</button>
      </div>

      <!-- TASKS TAB -->
      <div id="tasks-section" class="space-y-4">
        <p class="text-xs text-slate-400 bg-slate-800 p-3 rounded-lg border border-slate-700">
          ⚠️ <strong class="text-slate-200">Rules:</strong> Click a task to open the ad link. Stay on the opened ad tab for at least <span class="text-emerald-400 font-bold">30 seconds</span>. Returning early will immediately cancel your reward! Each task has a 2-minute cooldown.
        </p>

        <div id="tasks-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Task cards generated dynamically by JS -->
        </div>
      </div>

      <!-- WITHDRAWAL TAB -->
      <div id="withdraw-section" class="hidden bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl space-y-4 max-w-md mx-auto">
        <h3 class="text-base font-bold text-slate-200">Request Withdrawal (Pakistani Local)</h3>
        <p class="text-xs text-slate-400">Minimum withdrawal amount is <span class="text-emerald-400 font-bold">PKR 10.00</span>.</p>
        
        <form onsubmit="handleWithdrawal(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Amount (Min PKR 10)</label>
            <input type="number" id="withdraw-amount" min="10" step="0.1" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded text-sm text-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Payment Method</label>
            <select id="withdraw-method" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded text-sm text-slate-200">
              <option value="Easypaisa">Easypaisa</option>
              <option value="JazzCash">JazzCash</option>
              <option value="Nayapay">Nayapay</option>
              <option value="Bank">Bank Transfer</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Account Number / IBAN</label>
            <input type="text" id="withdraw-account" placeholder="03001234567" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded text-sm text-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Account Title / Name</label>
            <input type="text" id="withdraw-name" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded text-sm text-white">
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 py-2.5 rounded font-bold text-sm transition">Submit Withdrawal Request</button>
        </form>
      </div>

    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://flbruzcmuhhxhakdvour.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_zxLPB_25AgRGB-6GQ0isWg_g_7CXyib";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const MONETAG_LINKS = [
      "https://omg10.com/4/7349692", "https://omg10.com/4/7349688",
      "https://omg10.com/4/7393659", "https://omg10.com/4/7343595",
      "https://omg10.com/4/7349687", "https://omg10.com/4/7351274",
      "https://omg10.com/4/7349694", "https://omg10.com/4/7349690",
      "https://omg10.com/4/7349680", "https://omg10.com/4/11831163",
      "https://omg10.com/4/7393664", "https://omg10.com/4/7346296",
      "https://omg10.com/4/7349689", "https://omg10.com/4/7345679",
      "https://omg10.com/4/7382951", "https://omg10.com/4/7393658"
    ];

    let currentUser = null;
    let userProfile = { balance: 0.00 };
    let activeTaskId = null;
    let taskStartTime = null;
    let isTaskRunning = false;
    let taskCooldowns = {};

    window.addEventListener('DOMContentLoaded', async () => {
      renderTasksGrid();
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
          currentUser = session.user;
          await loadUserProfile();
          showDashboard();
        }
      } catch (err) {
        console.error("Session check error:", err);
      }
    });

    function renderTasksGrid() {
      const grid = document.getElementById('tasks-grid');
      grid.innerHTML = '';

      MONETAG_LINKS.forEach((link, index) => {
        const taskId = index + 1;
        const isCooldown = taskCooldowns[taskId] && Date.now() < taskCooldowns[taskId];

        grid.innerHTML += `
          <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow flex flex-col justify-between space-y-3">
            <div class="flex justify-between items-center">
              <span class="font-bold text-slate-200">Ad Task #${taskId}</span>
              <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded font-bold">+PKR 0.10</span>
            </div>
            <button id="task-btn-${taskId}" onclick="startTask(${taskId}, '${link}')" 
              ${isCooldown ? 'disabled' : ''}
              class="w-full ${isCooldown ? 'bg-slate-700 text-slate-400 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-500 text-white'} py-2 rounded-lg font-bold text-xs transition">
              ${isCooldown ? 'In Cooldown' : 'Open Ad & Earn (30s)'}
            </button>
          </div>
        `;
      });
    }

    function switchTab(tab) {
      if (tab === 'login') {
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('signup-form').classList.add('hidden');
        document.getElementById('tab-login-btn').className = "flex-1 py-2 font-semibold text-emerald-400 border-b-2 border-emerald-400";
        document.getElementById('tab-signup-btn').className = "flex-1 py-2 font-semibold text-slate-400";
      } else {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('signup-form').classList.remove('hidden');
        document.getElementById('tab-signup-btn').className = "flex-1 py-2 font-semibold text-emerald-400 border-b-2 border-emerald-400";
        document.getElementById('tab-login-btn').className = "flex-1 py-2 font-semibold text-slate-400";
      }
    }

    function switchDashboardTab(tab) {
      if (tab === 'tasks') {
        document.getElementById('tasks-section').classList.remove('hidden');
        document.getElementById('withdraw-section').classList.add('hidden');
        document.getElementById('dash-tasks-btn').className = "flex-1 py-2.5 font-bold text-emerald-400 border-b-2 border-emerald-400";
        document.getElementById('dash-withdraw-btn').className = "flex-1 py-2.5 font-bold text-slate-400";
      } else {
        document.getElementById('tasks-section').classList.add('hidden');
        document.getElementById('withdraw-section').classList.remove('hidden');
        document.getElementById('dash-withdraw-btn').className = "flex-1 py-2.5 font-bold text-emerald-400 border-b-2 border-emerald-400";
        document.getElementById('dash-tasks-btn').className = "flex-1 py-2.5 font-bold text-slate-400";
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-signup-submit');
      btn.innerText = "Creating account...";
      btn.disabled = true;

      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const name = document.getElementById('signup-name').value;
      const phone = document.getElementById('signup-phone').value;

      try {
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: { data: { full_name: name, phone_number: phone } }
        });

        if (error) throw error;

        showAlert("Account created successfully!", 'success');
        currentUser = data.user;
        await loadUserProfile();
        showDashboard();
      } catch (err) {
        showAlert(err.message, 'error');
      } finally {
        btn.innerText = "Create Account";
        btn.disabled = false;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-login-submit');
      btn.innerText = "Logging in...";
      btn.disabled = true;

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;

        currentUser = data.user;
        await loadUserProfile();
        showDashboard();
      } catch (err) {
        showAlert(err.message, 'error');
      } finally {
        btn.innerText = "Login to Dashboard";
        btn.disabled = false;
      }
    }

    async function logout() {
      await supabase.auth.signOut();
      location.reload();
    }

    async function loadUserProfile() {
      try {
        const { data, error } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', currentUser.id)
          .single();

        if (data) {
          userProfile = data;
        }
      } catch (e) {
        console.warn("Profile fetch fallback:", e);
      }
      document.getElementById('user-balance').innerText = `PKR ${parseFloat(userProfile.balance || 0).toFixed(2)}`;
    }

    function showDashboard() {
      document.getElementById('auth-box').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('nav-user').classList.remove('hidden');
    }

    function startTask(taskId, link) {
      if (taskCooldowns[taskId] && Date.now() < taskCooldowns[taskId]) {
        showAlert(`Task #${taskId} is in cooldown. Please wait!`, "error");
        return;
      }

      window.open(link, '_blank');
      activeTaskId = taskId;
      taskStartTime = Date.now();
      isTaskRunning = true;

      showAlert(`Ad Task #${taskId} opened. Stay on that ad tab for 30 seconds!`, "info");
    }

    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible" && isTaskRunning) {
        const elapsedTime = (Date.now() - taskStartTime) / 1000;
        isTaskRunning = false;

        if (elapsedTime < 30) {
          showAlert(`FAILED: Task #${activeTaskId} cancelled! You returned after only ${Math.floor(elapsedTime)}s. Stay on ad tab for 30s.`, "error");
        } else {
          await rewardUser(activeTaskId);
        }
        activeTaskId = null;
      }
    });

    async function rewardUser(taskId) {
      const currentBal = parseFloat(userProfile.balance || 0);
      const newBalance = currentBal + 0.10;

      try {
        await supabase
          .from('profiles')
          .update({ balance: newBalance })
          .eq('id', currentUser.id);
      } catch (err) {
        console.error("Balance update warning:", err);
      }

      showAlert(`SUCCESS! PKR 0.10 awarded for Task #${taskId}.`, "success");
      userProfile.balance = newBalance;
      document.getElementById('user-balance').innerText = `PKR ${newBalance.toFixed(2)}`;
      
      taskCooldowns[taskId] = Date.now() + 120 * 1000;
      renderTasksGrid();

      setTimeout(() => {
        renderTasksGrid();
      }, 120000);
    }

    async function handleWithdrawal(e) {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('withdraw-amount').value);
      const method = document.getElementById('withdraw-method').value;
      const account = document.getElementById('withdraw-account').value;
      const name = document.getElementById('withdraw-name').value;

      if (amount < 10) {
        showAlert("Minimum withdrawal amount is PKR 10!", "error");
        return;
      }

      if (amount > userProfile.balance) {
        showAlert("Insufficient balance for this withdrawal!", "error");
        return;
      }

      const newBalance = userProfile.balance - amount;

      try {
        const { error: withdrawError } = await supabase
          .from('withdrawals')
          .insert({
            user_id: currentUser.id,
            amount,
            payment_method: method,
            account_number: account,
            account_name: name
          });

        if (withdrawError) throw withdrawError;

        await supabase.from('profiles').update({ balance: newBalance }).eq('id', currentUser.id);
        
        userProfile.balance = newBalance;
        document.getElementById('user-balance').innerText = `PKR ${newBalance.toFixed(2)}`;
        showAlert("Withdrawal request submitted! It will be reviewed manually.", "success");
      } catch (err) {
        showAlert(err.message, "error");
      }
    }

    function showAlert(msg, type) {
      const box = document.getElementById('alert-box');
      box.classList.remove('hidden', 'bg-red-500/20', 'border-red-500', 'text-red-300', 'bg-emerald-500/20', 'border-emerald-500', 'text-emerald-300', 'bg-blue-500/20', 'border-blue-500', 'text-blue-300');
      
      if (type === 'error') {
        box.classList.add('bg-red-500/20', 'border-red-500', 'text-red-300');
      } else if (type === 'success') {
        box.classList.add('bg-emerald-500/20', 'border-emerald-500', 'text-emerald-300');
      } else {
        box.classList.add('bg-blue-500/20', 'border-blue-500', 'text-blue-300');
      }
      
      box.innerText = msg;
    }
  </script>
</body>
</html>
