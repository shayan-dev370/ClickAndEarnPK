<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click&EarnPK</title>
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0;
            font-size: 2rem;
        }

        .header h1 span {
            color: var(--primary);
        }

        .header p {
            color: var(--text-muted);
            margin-top: 4px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--bg);
            color: var(--text);
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            background-color: var(--bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .stat-card label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .stat-card div {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary);
        }

        .timer-display {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin: 12px 0;
            color: var(--primary);
        }

        .message {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }

        .message.error {
            background-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            display: block;
        }

        .message.success {
            background-color: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
            display: block;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 20px 0;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- App Title Header -->
        <div class="header">
            <h1>Click<span>&amp;EarnPK</span></h1>
            <p>Earn rewards and request withdrawals.</p>
        </div>

        <!-- Auth View (Shown when logged out) -->
        <div id="authView" class="card">
            <h2>Account Access</h2>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required />
            </div>
            
            <button id="btnLogin">Log In</button>
            <button id="btnSignUp" class="btn-secondary">Create Account</button>
            
            <div id="authMessage" class="message"></div>
        </div>

        <!-- Main Dashboard (Shown when logged in) -->
        <div id="dashboardView" class="card" style="display: none;">
            <p>Logged in as: <b id="userEmail"></b></p>

            <div class="stats-grid">
                <div class="stat-card">
                    <label>Balance</label>
                    <div id="balanceDisplay">0.00 PKR</div>
                </div>
                <div class="stat-card">
                    <label>Ads Watched</label>
                    <div id="adsWatchedDisplay">0</div>
                </div>
            </div>

            <hr />

            <!-- Watch Ad Section -->
            <h2>Watch Ad &amp; Earn 0.1 PKR</h2>
            <div class="timer-display" id="timerDisplay">20s</div>
            <button id="btnWatchAd">Start Watching Ad</button>
            <div id="adMessage" class="message"></div>

            <hr />

            <!-- Withdrawal Section -->
            <h2>Withdraw Earnings (Min: 5 PKR)</h2>
            <div class="form-group">
                <label for="paymentMethod">Payment Method</label>
                <select id="paymentMethod">
                    <option value="Easypaisa">Easypaisa</option>
                    <option value="JazzCash">JazzCash</option>
                </select>
            </div>
            <div class="form-group">
                <label for="accountDetails">Account Number / Phone</label>
                <input type="text" id="accountDetails" placeholder="03XXXXXXXXX" />
            </div>
            <div class="form-group">
                <label for="withdrawAmount">Amount (PKR)</label>
                <input type="number" id="withdrawAmount" placeholder="5.00" min="5.00" step="0.5" />
            </div>

            <button id="btnWithdraw">Request Withdrawal</button>
            <div id="withdrawMessage" class="message"></div>

            <button id="btnLogout" class="btn-secondary">Log Out</button>
        </div>
    </div>

    <script>
        // ------------------------------------------------------------------
        // REPLACE THESE WITH YOUR SUPABASE PROJECT CREDENTIALS
        // ------------------------------------------------------------------
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // State Variables
        let currentAdSessionId = null;
        let adCountdownTimer = null;

        // DOM Elements
        const authView = document.getElementById('authView');
        const dashboardView = document.getElementById('dashboardView');
        const userEmail = document.getElementById('userEmail');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const adsWatchedDisplay = document.getElementById('adsWatchedDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const btnWatchAd = document.getElementById('btnWatchAd');

        // Helper: Show Message
        function showMsg(elementId, text, isError = false) {
            const el = document.getElementById(elementId);
            el.textContent = text;
            el.className = `message ${isError ? 'error' : 'success'}`;
        }

        function clearMsg(elementId) {
            const el = document.getElementById(elementId);
            el.style.display = 'none';
        }

        // --- AUTHENTICATION ---
        document.getElementById('btnSignUp').addEventListener('click', async () => {
            clearMsg('authMessage');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) {
                showMsg('authMessage', error.message, true);
            } else {
                showMsg('authMessage', 'Account created successfully! Check email or log in.');
            }
        });

        document.getElementById('btnLogin').addEventListener('click', async () => {
            clearMsg('authMessage');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                showMsg('authMessage', error.message, true);
            } else {
                checkUser();
            }
        });

        document.getElementById('btnLogout').addEventListener('click', async () => {
            await supabase.auth.signOut();
            checkUser();
        });

        // --- DASHBOARD & PROFILE DATA ---
        async function fetchUserProfile(userId) {
            const { data, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('user_id', userId)
                .single();

            if (data) {
                balanceDisplay.textContent = `${Number(data.balance_pkr).toFixed(2)} PKR`;
                adsWatchedDisplay.textContent = data.total_ads_watched;
            }
        }

        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                authView.style.display = 'none';
                dashboardView.style.display = 'block';
                userEmail.textContent = session.user.email;
                fetchUserProfile(session.user.id);
            } else {
                authView.style.display = 'block';
                dashboardView.style.display = 'none';
            }
        }

        // --- AD WATCH LOGIC ---
        btnWatchAd.addEventListener('click', async () => {
            clearMsg('adMessage');
            btnWatchAd.disabled = true;

            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return;

            // 1. Create Ad Session Record
            const { data, error } = await supabase
                .from('ad_sessions')
                .insert([{ user_id: session.user.id }])
                .select()
                .single();

            if (error) {
                showMsg('adMessage', 'Failed to start ad session.', true);
                btnWatchAd.disabled = false;
                return;
            }

            currentAdSessionId = data.id;
            let timeLeft = 20;
            timerDisplay.textContent = `${timeLeft}s`;

            // 2. Start Countdown Timer
            adCountdownTimer = setInterval(async () => {
                timeLeft--;
                timerDisplay.textContent = `${timeLeft}s`;

                if (timeLeft <= 0) {
                    clearInterval(adCountdownTimer);
                    // 3. Claim Reward RPC Call
                    const { data: rpcData, error: rpcError } = await supabase.rpc('claim_ad_reward', {
                        p_session_id: currentAdSessionId
                    });

                    if (rpcError) {
                        showMsg('adMessage', rpcError.message, true);
                    } else {
                        showMsg('adMessage', '0.10 PKR credited to your balance!');
                        fetchUserProfile(session.user.id);
                    }
                    btnWatchAd.disabled = false;
                }
            }, 1000);
        });

        // --- WITHDRAWAL LOGIC ---
        document.getElementById('btnWithdraw').addEventListener('click', async () => {
            clearMsg('withdrawMessage');
            const method = document.getElementById('paymentMethod').value;
            const account = document.getElementById('accountDetails').value;
            const amount = parseFloat(document.getElementById('withdrawAmount').value);

            if (!account) {
                showMsg('withdrawMessage', 'Please enter your account details.', true);
                return;
            }

            if (isNaN(amount) || amount < 5.0) {
                showMsg('withdrawMessage', 'Minimum withdrawal amount is 5.00 PKR.', true);
                return;
            }

            const { data, error } = await supabase.rpc('request_withdrawal', {
                p_method: method,
                p_account: account,
                p_amount: amount
            });

            if (error) {
                showMsg('withdrawMessage', error.message, true);
            } else {
                showMsg('withdrawMessage', 'Withdrawal requested successfully!');
                const { data: { session } } = await supabase.auth.getSession();
                fetchUserProfile(session.user.id);
            }
        });

        // Initial check on page load
        checkUser();
    </script>
</body>
</html>
